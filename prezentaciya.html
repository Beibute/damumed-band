<script>
function fit(){
  document.querySelectorAll('.stage').forEach(function(st){
    var s = st.clientWidth / 1920;
    st.querySelector('.slide').style.transform = 'scale(' + s + ')';
  });
}
window.addEventListener('resize', fit); window.addEventListener('load', fit); fit();
document.getElementById('prn').addEventListener('click', function(e){e.preventDefault();window.print();});
document.addEventListener('keydown', function(e){
  if(e.key!=='ArrowDown' && e.key!=='ArrowUp' && e.key!=='PageDown' && e.key!=='PageUp') return;
  e.preventDefault();
  var ws = Array.prototype.slice.call(document.querySelectorAll('.wrap'));
  var y = window.scrollY + 90, cur = 0;
  ws.forEach(function(w,i){ if(w.offsetTop <= y + 20) cur = i; });
  var next = (e.key==='ArrowDown'||e.key==='PageDown') ? Math.min(cur+1, ws.length-1) : Math.max(cur-1, 0);
  window.scrollTo({top: ws[next].offsetTop - 70, behavior:'smooth'});
});
</script>
